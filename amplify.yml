version: 1
applications:
  - appRoot: ang-odontoprint-master
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/ang-odontoprint
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
